name: Generar Short en español

# A mano: pestaña "Actions" → "Generar Short en español" → "Run workflow".
# Solo: cada día a las 6:17 a. m. de Colombia (11:17 UTC) con el tema del día de temas_shorts.txt.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema del Short (en español). Vacío = el tema del día de temas_shorts.txt"
        required: false
        type: string
      guion_archivo:
        description: "Tu guion (se respeta tal cual): ruta en el repo, p. ej. guiones/ejemplo.txt"
        required: false
        type: string
      guion:
        description: "O pega tu guion aquí, con las frases separadas por |"
        required: false
        type: string
      voz:
        description: "Voz de edge-tts"
        required: false
        default: "es-MX-JorgeNeural"
        type: choice
        options:
          - es-MX-JorgeNeural
          - es-MX-DaliaNeural
          - es-ES-AlvaroNeural
          - es-ES-ElviraNeural
          - es-AR-TomasNeural
          - es-CO-GonzaloNeural
          - es-US-AlonsoNeural
      velocidad:
        description: "Velocidad de la voz (p. ej. +8%, +15%)"
        required: false
        default: "+8%"
        type: string
      subir_youtube:
        description: "Subir a YouTube (necesita el secreto YT_TOKEN_JSON)"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - privado
          - oculto

permissions:
  contents: read

jobs:
  generar:
    name: Generar el video
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Los valores del formulario pasan por variables de entorno (nunca se interpolan en el script).
      # En la ejecución programada no hay formulario: se usan los valores por defecto y la variable
      # del repositorio SUBIR_YOUTUBE (no | privado | oculto).
      TEMA: ${{ inputs.tema }}
      GUION_ARCHIVO: ${{ inputs.guion_archivo }}
      GUION: ${{ inputs.guion }}
      VOZ_ES: ${{ inputs.voz || 'es-MX-JorgeNeural' }}
      VELOCIDAD_VOZ: ${{ inputs.velocidad || '+8%' }}
      SUBIR_YOUTUBE: ${{ inputs.subir_youtube || vars.SUBIR_YOUTUBE || 'no' }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # Opcionales (niveles gratuitos): si existen, un LLM escribe el guion; si no, se usa Wikipedia en español.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Si Gemini falla (p. ej. 503 por saturación), se prueba Groq (gratis) antes de usar la plantilla.
      LLM_FALLBACKS: groq
      # Opcional: variable del repositorio para cambiar de modelo si el proveedor retira el de por defecto.
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -n 1

      - name: Instalar dependencias de Python
        run: pip install -e .

      - name: Comprobar la clave de Pixabay
        run: |
          if [ -z "$PIXABAY_API_KEY" ]; then
            echo "::warning::No existe el secreto PIXABAY_API_KEY: el video tendrá un fondo de color liso. Créalo en Settings → Secrets and variables → Actions."
          fi

      - name: Comprobar las claves de IA
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::No hay GEMINI_API_KEY ni GROQ_API_KEY: el guion saldrá de la plantilla del canal."
          elif [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::No existe el secreto GROQ_API_KEY: si Gemini está saturado no habrá respaldo. Créalo gratis en console.groq.com."
          fi

      - name: Generar el Short
        run: |
          if [ -n "$GUION_ARCHIVO" ]; then
            python -m purffle_shorts.short_es --tema "$TEMA" --guion "$GUION_ARCHIVO" --salida salida
          elif [ -n "$GUION" ]; then
            python -m purffle_shorts.short_es --tema "$TEMA" --guion-texto "$GUION" --salida salida
          else
            python -m purffle_shorts.short_es --tema "$TEMA" --temas temas_shorts.txt --salida salida
          fi

      - name: Resumen
        if: success()
        run: |
          carpeta=$(dirname "$(ls salida/*/short.mp4 | head -n 1)")
          echo "carpeta=$carpeta" >> "$GITHUB_ENV"
          {
            echo "## 🎬 Short generado"
            echo
            echo "**Tema:** $(python -c "import json,sys; print(json.load(open(sys.argv[1]))['tema'])" "$carpeta/metadatos.json")"
            echo
            echo "**Duración:** $(python -c "import json,sys; print(json.load(open(sys.argv[1]))['duracion_segundos'])" "$carpeta/metadatos.json") s"
            echo
            echo "### Título"
            echo '```'
            cat "$carpeta/titulo.txt"
            echo '```'
            echo "### Descripción"
            echo '```'
            cat "$carpeta/descripcion.txt"
            echo '```'
            echo "### Guion"
            echo '```'
            cat "$carpeta/guion.txt"
            echo '```'
            echo "Descarga el video en **Artifacts**, al final de esta página."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el video como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            ${{ env.carpeta }}/short.mp4
            ${{ env.carpeta }}/titulo.txt
            ${{ env.carpeta }}/descripcion.txt
            ${{ env.carpeta }}/guion.txt
            ${{ env.carpeta }}/subtitulos.srt
            ${{ env.carpeta }}/metadatos.json
          if-no-files-found: error
          retention-days: 14

      - name: Subir a YouTube
        if: success() && env.SUBIR_YOUTUBE != 'no'
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "::warning::Para subir a YouTube falta el secreto YT_TOKEN_JSON (ver README.es.md). El video está en Artifacts."
            exit 0
          fi
          export YT_TOKEN_FILE="$RUNNER_TEMP/token.json"
          printf '%s' "$YT_TOKEN_JSON" > "$YT_TOKEN_FILE"
          chmod 600 "$YT_TOKEN_FILE"
          python -m purffle_shorts.short_es --subir-carpeta "$carpeta" --subir "$SUBIR_YOUTUBE"
          url=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('youtube_url',''))" "$carpeta/metadatos.json")
          {
            echo
            echo "### YouTube"
            echo "Subido como **$SUBIR_YOUTUBE**: $url"
            echo "Revísalo y publícalo desde YouTube Studio."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$YT_TOKEN_FILE"
